# Render Blueprint: 저장소를 연결하면 이 설정으로 웹 서비스가 만들어진다.
services:
  - type: web
    name: f1-pitwall
    runtime: node
    plan: free
    region: singapore        # DB(Supabase 시드니)와 가장 가까운 Render 리전
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # 값은 Render 대시보드에서 직접 입력(저장소에 넣지 않는다)
      - key: NODE_VERSION
        value: "22"
